version: "3.8"

services:
  home:
    build: ../home-app
    container_name: home-app
    ports:
      - "3001:3000"
    restart: always

  cart:
    build: ../cart-app
    container_name: cart-app
    ports:
      - "3002:3000"
    restart: always

  api:
    build: ./api
    container_name: api
    ports:
      - "4000:4000"
    restart: always
